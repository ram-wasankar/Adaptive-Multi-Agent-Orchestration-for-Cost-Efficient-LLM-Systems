[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-agent-orchestration"
version = "0.1.0"
description = "Budget-aware model routing, verified escalation, and explicit agent handoffs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
orchestrate = "orchestration.cli:main"

[tool.setuptools.packages.find]
include = ["orchestration*"]
